services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    networks:
      - backend-net

  backend:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      EMAIL_CONFIRMATION_REQUIRED: ${EMAIL_CONFIRMATION_REQUIRED:-true}
    depends_on:
      mailpit:
        condition: service_started
