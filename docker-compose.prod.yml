services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaluana
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kaluana-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d kaluana"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - kaluana-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      PAIRING_CODE_EXPIRATION_MINUTES: ${PAIRING_CODE_EXPIRATION_MINUTES}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kaluana-net
    restart: unless-stopped
    # Sem "ports": o backend só é alcançável pela rede interna do compose.
    # Quem fala com a internet é o Caddy.

  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - kaluana-net
    restart: unless-stopped

networks:
  kaluana-net:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
