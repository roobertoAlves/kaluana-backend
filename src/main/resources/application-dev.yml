server:
  port: 8080

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: kaluana-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kaluana}
    username: ${DB_USER:kaluana}
    password: ${DB_PASSWORD:kaluana}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    br.edu.ifsp.kaluana: DEBUG
    org.springframework.web: DEBUG

management:
  # SMTP fora do ar não derruba o health check: o cadastro avisa e dá para reenviar.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Confirmação de e-mail no cadastro. SMTP em spring.mail (abaixo): Mailpit no
  # desenvolvimento; para Gmail, MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
  # MAIL_SMTP_AUTH=true, MAIL_STARTTLS=true e uma senha de app do Google.
  mail:
    require-confirmation: ${EMAIL_CONFIRMATION_REQUIRED:true}
    from: ${MAIL_FROM:Kaluanã <nao-responda@kaluana.local>}
    confirmation-base-url: ${PUBLIC_API_URL:http://localhost:8080}
    token-expiration-hours: ${EMAIL_CONFIRMATION_HOURS:24}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  pairing:
    code-expiration-minutes: ${PAIRING_CODE_EXPIRATION_MINUTES:15}
  rate-limit:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    base-url: ${ASSISTANT_BASE_URL:http://localhost:11434/v1}
    model: ${ASSISTANT_MODEL:llama3.2:3b}
    api-key: ${ASSISTANT_API_KEY:}
    timeout: ${ASSISTANT_TIMEOUT:20s}
    max-requests-per-hour: ${ASSISTANT_MAX_REQUESTS_PER_HOUR:20}
    reasoning-effort: ${ASSISTANT_REASONING_EFFORT:none}
