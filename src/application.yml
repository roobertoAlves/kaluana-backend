server:
  port: 8080

spring:
  application:
    name: kaluana-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kaluana}
    username: ${DB_USER:kaluana}
    password: ${DB_PASSWORD:kaluana}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-aleatorio-de-pelo-menos-32-bytes}
    access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  pairing:
    code-expiration-minutes: ${PAIRING_CODE_EXPIRATION_MINUTES:15}
